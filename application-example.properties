# Copiar a config/application-local.properties (ignorado por Git).
# Usar una base vacía de desarrollo, nunca datos de clientes.
spring.datasource.url=jdbc:postgresql://localhost:5432/pequelandia_demo
spring.datasource.username=CAMBIAR_USUARIO_LOCAL
spring.datasource.password=CAMBIAR_PASSWORD_LOCAL
# Solo para inicializar una base descartable vacía; luego usar validate.
spring.jpa.hibernate.ddl-auto=update
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=demo@example.invalid
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
app.admin.email=admin@example.invalid

# ID fijo de la cuenta administrativa. 0 conserva la búsqueda inicial de un único admin.
app.security.admin-id=0
# Desactivar hasta configurar un SMTP de pruebas; los mensajes quedan en cola.
app.mail.delivery-enabled=false

# Aviso al administrador cuando el stock queda en este valor o por debajo.
app.stock.minimo=${PEQUELANDIA_STOCK_MINIMO:5}

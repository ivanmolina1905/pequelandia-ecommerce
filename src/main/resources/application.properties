spring.application.name=pequelandia
spring.config.import=optional:file:./config/application-local.properties
spring.docker.compose.enabled=false
spring.datasource.url=${PEQUELANDIA_DB_URL}
spring.datasource.username=${PEQUELANDIA_DB_USERNAME}
spring.datasource.password=${PEQUELANDIA_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.mail.host=${PEQUELANDIA_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${PEQUELANDIA_MAIL_PORT:587}
spring.mail.username=${PEQUELANDIA_MAIL_USERNAME:}
spring.mail.password=${PEQUELANDIA_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.admin.email=${PEQUELANDIA_ADMIN_EMAIL:}
spring.mail.properties.mail.debug=false
logging.level.org.eclipse.angus.mail=WARN
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Esquema aditivo de la cola: no cambia las tablas del negocio.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/notificaciones.sql
app.security.admin-id=${PEQUELANDIA_ADMIN_ID:0}
app.mail.delivery-enabled=${PEQUELANDIA_MAIL_DELIVERY_ENABLED:true}

app.stock.minimo=${PEQUELANDIA_STOCK_MINIMO:5}

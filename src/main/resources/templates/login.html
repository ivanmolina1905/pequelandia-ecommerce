<body>
  <!-- Cabecera fija -->

<!-- Menú fijo -->

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTogglerDemo03" aria-controls="navbarTogglerDemo03" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
       <a class="navbar-brand" href="/" th:href="@{/}">
        <img src="/imagenes/peq.png.jpg" width="120" height="90" class="d-inline-block align-text-auto">
      </a>
      <div class="collapse navbar-collapse" id="navbarTogglerDemo03" >

			</button>

            <a class="nav-link" th:href="@{/carrito/vercarrito}" target="_self" aria-label="Ver carrito" title="Ver carrito">

          <!-- Si no hay usuario logueado -->
<li class="nav-item me-5" th:if="${session.usuario == null}">
  <a class="nav-link" th:href="@{/auth/login}" title="Iniciar sesión">
    <img src="/imagenes/editar-informacion.png" alt="cuenta" width="65" height="65">
  </a>
</li>
<!-- Si hay usuario logueado -->
<li class="nav-item dropdown me-5" th:if="${session.usuario != null}">
  <a class="nav-link dropdown-toggle" href="#" id="userMenu" role="button" data-bs-toggle="dropdown">
    <img src="/imagenes/editar-informacion.png" alt="cuenta" width="65" height="65">
  </a>
  <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenu">

    <li><hr class="dropdown-divider"></li>

      <a class="dropdown-item" th:href="@{/panel/admin}">Panel de administración</a>
    </li>
    <li th:if="${!@identidadService.esAdmin(session.usuario)}">
      <a class="dropdown-item" th:href="@{/panel/usuario}">Mi panel</a>
    </li>
    <li><a class="dropdown-item text-danger" th:href="@{/auth/logout}">Cerrar sesión</a></li>
  </ul>
</li>
        </ul>
      </div>
    </div>
  </nav>
</div>


  <!-- FORMULARIO DE LOGIN -->
  <section class="container-fluid bg-light-amber min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow login-card" style="max-width:420px; width:100%;">
      <div class="card-body p-4 p-md-5">
        <h1 class="h4 text-center mb-4">Iniciar sesión</h1>
		
		<div th:if="${param.registroExitoso}"
     	class="alert alert-success">
 	 	Cuenta creada correctamente. Ya podés iniciar sesión.
		</div>
        
        <form th:action="@{/auth/login}" method="post" novalidate>
<input type="hidden" name="_csrf" th:value="${csrfToken}">
          <div class="mb-3">
            <label for="username" class="form-label">Usuario o email</label>
            <input type="text" class="form-control" id="username" name="username"
                   placeholder="tuusuario" autocomplete="username" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="••••••••" autocomplete="current-password" required>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember" name="remember">
              <label class="form-check-label" for="remember">Recordarme</label>
            </div>
            <a class="link-amber" href="#" title="Recuperar contraseña">Olvidé mi contraseña</a>
          </div>

          <button type="submit" class="btn btn-amber w-100 mb-2">Ingresar</button>

          <!-- Mensaje de error -->
          <div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div>
        </form>

        <hr class="my-4">
        <p class="text-center mb-2">¿No tenés cuenta?</p>
        <a class="btn btn-outline-amber w-100" th:href="@{/auth/registro}">Crear cuenta</a>
      </div>
    </div>
  </section>

  <script th:src="@{/bootstrap-5.3.5-dist/js/bootstrap.bundle.min.js}"></script>
  <script>
//--- Reloj en vivo ---
  (function liveClock(){
    const el = document.getElementById('clock');
    if (!el) return;
    const pad = n => n.toString().padStart(2,'0');
    const tick = () => {
      const d = new Date();
      const hh = pad(d.getHours()), mm = pad(d.getMinutes()), ss = pad(d.getSeconds());
      el.textContent = `${hh}:${mm}:${ss}`;
    };
    tick();
    setInterval(tick, 1000);
  })();
  </script>
</body>
</html>

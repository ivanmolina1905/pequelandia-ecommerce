<!-- carrito -->
<div class="container my-5" style="max-width: 95%; margin-top: 180px;padding-top: 120px;">
    <div class="table-responsive" >
      <table class="table align-middle text-center">
        <thead class="table-warning">
          <tr>
            <th>Producto</th>
            <th>Detalle</th>
            <th>Precio Unitario</th>
            <th>Cantidad</th>
            <th>Total</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="cart-items">
          <!-- Producto de ejemplo -->
          <tr>
            <td>
              <img src="/imagenes/ejemplo.jpg" alt="Producto" width="80" height="80">
            </td>
            <td>Body de algodón 0-6 meses</td>
            <td>$<span class="unit-price">1500</span></td>
            <td>
              <input type="number" class="form-control quantity" min="1" value="1" style="width: 80px;" onchange="updateTotals(this)">
            </td>
            <td>$<span class="item-total">1500</span></td>
            <td>
              <button class="btn btn-danger" onclick="removeItem(this)">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  
    <div class="d-flex justify-content-between align-items-center mt-4">
      <button class="btn btn-outline-danger" onclick="emptyCart()">Vaciar carrito</button>
  
      <h4>Total general: $<span id="grand-total">1500</span></h4>
  
      <div>
        <a href="/productos.html" class="btn btn-outline-primary me-2">Seguir comprando</a>
        <a href="/checkout.html" class="btn btn-success">Finalizar compra</a>
      </div>
    </div>
  </div>
  
  <script>
    function updateTotals(input) {
      const row = input.closest('tr');
      const unitPrice = parseFloat(row.querySelector('.unit-price').innerText);
      const quantity = parseInt(input.value);
      const itemTotal = row.querySelector('.item-total');
      
      itemTotal.innerText = (unitPrice * quantity).toFixed(2);
      updateGrandTotal();
    }
  
    function removeItem(button) {
      const row = button.closest('tr');
      row.remove();
      updateGrandTotal();
    }
  
    function updateGrandTotal() {
      let total = 0;
      document.querySelectorAll('.item-total').forEach(item => {
        total += parseFloat(item.innerText);
      });
      document.getElementById('grand-total').innerText = total.toFixed(2);
    }
  
    function emptyCart() {
      document.getElementById('cart-items').innerHTML = '';
      updateGrandTotal();
    }
  </script>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Pequelandia - Recuperar contraseña</title>
<link rel="stylesheet" th:href="@{/bootstrap-5.3.5-dist/css/bootstrap.min.css}">
<link rel="stylesheet" th:href="@{/css/style.css}">
</head><body>
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
<section class="card shadow" style="max-width:460px;width:100%"><div class="card-body p-4">
<a th:href="@{/}" class="d-block text-center mb-3"><img th:src="@{/imagenes/peq.png.jpg}" alt="Pequelandia" width="120" height="90"></a><h1 class="h4">¿Olvidaste tu contraseña?</h1>
<p>Ingresá el correo de tu cuenta. Te enviaremos un enlace para crear una contraseña nueva.</p>
<div th:if="${mensaje}" th:text="${mensaje}" class="alert alert-success" role="status"></div>
<form th:action="@{/auth/recuperar}" method="post">
<input type="hidden" name="_csrf" th:value="${csrfToken}">
<label for="email" class="form-label">Correo electrónico</label>
<input id="email" name="email" type="email" maxlength="320" autocomplete="email" required class="form-control mb-3">
<button class="btn btn-amber w-100" type="submit">Enviar enlace</button>
</form><a class="d-block text-center mt-3" th:href="@{/auth/login}">Volver a iniciar sesión</a>
</div></section></main></body></html>
